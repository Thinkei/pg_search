name: build

on:
  push:
    branches:
      - master
      - github-actions
  pull_request:
    branches:
      - master
  schedule:
    - cron: "0 18 * * 6" # Saturdays at 12pm CST
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      CI: true
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASS: postgres
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['2.7', '3.0', '3.1', '3.2']
        active-record-version-env:
          - ACTIVE_RECORD_VERSION="~> 6.0.0"
          - ACTIVE_RECORD_VERSION="~> 6.1.0"
          - ACTIVE_RECORD_VERSION="~> 7.0.0"
        allow-failure: [false]
        include:
          - ruby-version: '3.2'
            active-record-version-env: ACTIVE_RECORD_BRANCH="main"
            allow-failure: true
          - ruby-version: '3.2'
            active-record-version-env: ACTIVE_RECORD_BRANCH="7-0-stable"
            allow-failure: true
          - ruby-version: '3.2'
            active-record-version-env: ACTIVE_RECORD_BRANCH="6-1-stable"
            allow-failure: true
    continue-on-error: ${{ matrix.allow-failure }}
    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
    - name: Set up Ruby
      uses: ruby/setup-ruby@eab2afb99481ca09a4e91171a8e0aee0e89bfedd # v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Set up test database
      env:
        PGPASSWORD: postgres
      run: createdb pg_search_test
    - name: Update bundle
      run: ${{ matrix.active-record-version-env }} bundle update
    - name: Run tests
      run: ${{ matrix.active-record-version-env }} bundle exec rake
